[pytest]
testpaths = tests
xfail_strict = true
addopts =
    --cov=custom_components/hub_energie
    --cov-config=.coveragerc
    # Full term report (no :skip-covered) so “skipped” only means pytest skips, not coverage rows.
    --cov-report=term-missing
    # Short summary: failed, errors, skips, xfails (makes accidental skips visible).
    -r fEsxX
