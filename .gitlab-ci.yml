# GitLab Pages: job artifact must include a `public/` folder at the repo root of the artifact.
# We build the Vue site under site/, then copy site/dist → public/ (nothing under ./public is committed).

pages:
  stage: deploy
  image: node:22-alpine
  script:
    - |
      set -e
      (cd site && npm ci && npm run build)
      rm -rf public
      mkdir -p public
      cp -r site/dist/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
