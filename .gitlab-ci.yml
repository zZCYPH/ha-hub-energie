# Hub Énergie — minimal CI: keep generated doc catalog in sync with config_flow.py + strings.json.
# Extend with your own test/build jobs as needed.

stages:
  - verify

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

flow_catalog_up_to_date:
  stage: verify
  image: python:3.12-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - pip install pytest
    - python scripts/extract_config_flow_catalog.py --check
    - python -m pytest tests/test_flow_catalog_coverage.py -v --no-cov
  cache: []

site_build_smoke:
  stage: verify
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - cd site
    - npm ci
    - npm run build
