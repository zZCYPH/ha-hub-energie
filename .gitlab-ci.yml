# GitLab Pages: artifact must include `public/` at repo root (site/dist → public).
#
# Semver tags (e.g. v0.2.3): build zip (integration + pre-built Lovelace frontend/dist),
# publish to the generic package registry, create a GitLab Release with a download link.
#
# Permissions: enable API access for the CI job token (Settings → CI/CD → Job token permissions),
# or set a project access token as CI variable GITLAB_RELEASE_TOKEN (api scope).

stages:
  - release
  - deploy

variables:
  GITLAB_PACKAGE_NAME: hub-energie

integration_release:
  stage: release
  image: node:22-alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  before_script:
    - apk add --no-cache zip rsync curl jq
  script:
    - |
      set -euo pipefail
      TAG="$CI_COMMIT_TAG"
      VERSION="${TAG#v}"
      MANIFEST_VER="$(node -p "JSON.parse(require('fs').readFileSync('custom_components/hub_energie/manifest.json','utf8')).version")"
      if [ "$MANIFEST_VER" != "$VERSION" ]; then
        echo "manifest.json version ($MANIFEST_VER) must match tag ($VERSION) without the leading v"
        exit 1
      fi
      (cd custom_components/hub_energie/frontend && npm ci && npm run build)
      STAGE="${CI_PROJECT_DIR}/.zip-stage"
      rm -rf "$STAGE"
      mkdir -p "$STAGE/custom_components"
      rsync -a \
        --exclude 'frontend/node_modules' \
        --exclude '__pycache__' \
        --exclude '.pytest_cache' \
        --exclude '*.pyc' \
        "${CI_PROJECT_DIR}/custom_components/hub_energie/" \
        "$STAGE/custom_components/hub_energie/"
      ZIP_NAME="hub-energie-${VERSION}.zip"
      (cd "$STAGE" && zip -qr "${CI_PROJECT_DIR}/${ZIP_NAME}" custom_components)
      echo "Uploading ${ZIP_NAME} to generic package ${GITLAB_PACKAGE_NAME}/${VERSION}..."
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "${CI_PROJECT_DIR}/${ZIP_NAME}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${GITLAB_PACKAGE_NAME}/${VERSION}/${ZIP_NAME}"
      PACKAGE_WEB_URL="${CI_PROJECT_URL}/-/packages/generic/${GITLAB_PACKAGE_NAME}/${VERSION}/${ZIP_NAME}"
      RELEASE_BODY=$'Archive: unzip at the root of your Home Assistant `config/` folder so you obtain `config/custom_components/hub_energie/`. The Lovelace bundle is pre-built in `frontend/dist/` (served by HA at `/hub_energie/`).'
      if [ -n "${GITLAB_RELEASE_TOKEN:-}" ]; then
        AUTH_HEADER="PRIVATE-TOKEN: ${GITLAB_RELEASE_TOKEN}"
      else
        AUTH_HEADER="JOB-TOKEN: ${CI_JOB_TOKEN}"
      fi
      EXISTING=$(curl -s -o /dev/null -w "%{http_code}" \
        --header "${AUTH_HEADER}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${TAG}")
      if [ "$EXISTING" = "200" ]; then
        echo "Release ${TAG} already exists (package upload done). Skipping release create."
        exit 0
      fi
      echo "Creating GitLab release ${TAG}..."
      jq -n \
        --arg name "$TAG" \
        --arg tag "$TAG" \
        --arg desc "$RELEASE_BODY" \
        --arg url "$PACKAGE_WEB_URL" \
        --arg linkname "$ZIP_NAME" \
        '{name:$name,tag_name:$tag,description:$desc,assets:{links:[{name:$linkname,url:$url}]}}' \
      | curl --fail --silent --show-error \
          --request POST \
          --header "${AUTH_HEADER}" \
          --header "Content-Type: application/json" \
          --data @- \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"

pages:
  stage: deploy
  image: node:22-alpine
  script:
    - |
      set -e
      # List GitLab releases → site/public/releases.json (then Vite copies to dist/)
      node site/scripts/fetch-releases.mjs
      (cd site && npm ci && npm run build)
      rm -rf public
      mkdir -p public
      cp -r site/dist/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
