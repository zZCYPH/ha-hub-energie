<p>
  Optional short <strong>site key</strong> (ASCII <code>a–z</code> and <code>0–9</code> only, 2–10 characters) used
  in <strong>entity_id</strong> prefixes for this installation. Leave empty to keep the default numeric segment and
  set a key later under <strong>Configure</strong>.
</p>
<p>
  If you enter a key during setup, it is <strong>locked</strong> afterwards and cannot be changed from the UI.
</p>
