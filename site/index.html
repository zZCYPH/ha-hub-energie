<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!--
      Social image URLs use a build-time canonical root (see vite.config.js hub-energie-html-social-meta).
      Crawlers (Facebook, etc.) need explicit og:image in the initial HTML, not only after client JS.
    -->
    <meta property="og:image" content="__HUB_ENERGIE_CANONICAL_ROOT__/img/og-social.png" />
    <meta property="og:image:secure_url" content="__HUB_ENERGIE_CANONICAL_ROOT__/img/og-social.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hub Énergie — intégration Home Assistant" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__HUB_ENERGIE_CANONICAL_ROOT__/img/og-social.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Hub Énergie — one Home Assistant integration for tariffs, energy, costs, solar, batteries, and diagnostics."
    />
    <title>Hub Énergie</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("hub-energie-doc-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-bs-theme", t);
            return;
          }
        } catch (e) {}
        document.documentElement.setAttribute("data-bs-theme", "dark");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="app"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
