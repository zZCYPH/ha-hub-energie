refresh:
  name: Refresh Hub Énergie
  description: Force a refresh of Hub Énergie coordinator data (all entries, or one if specified).
  fields:
    config_entry_id:
      name: Config entry
      description: Optional. When set, only this Hub Énergie configuration entry is refreshed.
      required: false
      selector:
        config_entry:
          integration: hub_energie

refresh_tariffs:
  name: Refresh tariffs
  description: Force a tariff fetch (auto-mode only) and update stored options for one or all entries.
  fields:
    config_entry_id:
      name: Config entry
      description: Optional. When set, only this Hub Énergie configuration entry is updated.
      required: false
      selector:
        config_entry:
          integration: hub_energie
